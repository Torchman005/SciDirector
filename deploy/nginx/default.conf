# =============================================================================
# SciDirector 前端 Nginx 配置
# -----------------------------------------------------------------------------
# 职责：托管构建好的静态资源，并把 /api 与 /ws 反向代理到 Go 网关。
#
# 为什么在容器内也做代理（而不是让前端直连网关）：
#   * 同源部署天然没有跨域问题，也不需要维护 CORS 白名单；
#   * WebSocket 的升级头由 Nginx 统一处理，前端代码里只写相对路径。
# =============================================================================

upstream scid_api {
    server api:8080;
    # 长连接复用：WebSocket 与高频轮询下能显著降低握手开销。
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：前端产物是文本，压缩收益很大。
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的静态资源可以长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 绝不缓存：否则发版后用户会一直加载旧版本引用的旧资源。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://scid_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 生成接口是快速返回的，但查询与重做接口可能稍慢，给 60s 足够。
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://scid_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # WebSocket 是长连接：读超时必须远大于任务时长，否则会在渲染中途被掐断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 关闭缓冲，保证事件能实时抵达浏览器（缓冲会让进度"一跳一跳"）。
        proxy_buffering off;
    }

    # SPA 回退：未知路径交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
