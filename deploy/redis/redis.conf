# =============================================================================
# SciDirector Redis 配置
# 用途：Asynq 任务队列 + 分镜状态快照 + 幂等锁 + 事件流(List) + WS 扇出(Pub/Sub)
# =============================================================================

bind 0.0.0.0
port 6379

# 队列场景下保护内存：达到上限时对「设置了 TTL 的 key」启用 LRU 淘汰。
# 注意：Asynq 的队列 key 不设 TTL，因此永远不会被淘汰（这是我们要的语义）。
maxmemory 1gb
maxmemory-policy volatile-lru

# AOF 持久化：任务队列不能因为重启丢任务
appendonly yes
appendfsync everysec
dir /data

# 长链路任务会有长时间空闲的阻塞读（Asynq 的 BRPOP），关闭空闲连接回收
timeout 0
tcp-keepalive 300

# 慢查询与键事件：用于观测任务延迟；事件通知供未来的实时看板使用
slowlog-log-slower-than 10000
notify-keyspace-events "Ex"

# 生产环境请开启：requirepass / rename-command
# requirepass ${SCID_REDIS_PASSWORD}
