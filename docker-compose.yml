# =============================================================================
# SciDirector - 本地/单机生产编排
# -----------------------------------------------------------------------------
# 责任划分：
#   · infra 层：redis（任务队列 + 状态）、postgres（LangGraph checkpoint）、
#               rustfs（分镜片段/成片等大文件对象存储，S3 兼容）
#   · svc   层：ai（Python 多智能体大脑）、api（Go 网关）、worker（Go 编排/媒体）、
#               web（React 分镜审核台）
#
# 启动：docker compose up -d --build
# 仅起依赖：docker compose up -d redis postgres rustfs
#
# 关于对象存储的选型：原先用 MinIO，但 MinIO 开源版**已归档停更**
# （dl.min.io 返回 410，官方声明不再提供安全更新，GitHub 最后 release 无可下载产物），
# 故换成同为 S3 兼容、仍在活跃维护的 RustFS。归档代码只依赖 S3 API，
# 不绑定具体产品（见 backend/internal/archive/s3.go）。
#
# 拉不到镜像时（Docker Hub 在部分网络下不可达，daemon 里的加速器也未必生效）：
#   docker pull <mirror>/library/redis:7.4-alpine   && docker tag ... redis:7.4-alpine
#   docker pull <mirror>/library/postgres:17-alpine && docker tag ... postgres:17-alpine
#   docker pull <mirror>/rustfs/rustfs:latest       && docker tag ... rustfs/rustfs:latest
# 先用显式镜像站主机名拉下来、再打成本文件引用的名字，
# 这样不必改 daemon.json（改它要重启 Docker）。
# =============================================================================

name: scidirector

x-restart: &restart
  restart: unless-stopped

x-go-build: &go-build
  context: .
  dockerfile: backend/Dockerfile

x-common-env: &common-env
  SCID_ENV: ${SCID_ENV:-dev}
  SCID_LOG_LEVEL: ${SCID_LOG_LEVEL:-info}
  SCID_REDIS_ADDR: redis:6379
  SCID_POSTGRES_DSN: postgres://scidirector:scidirector@postgres:5432/scidirector?sslmode=disable
  SCID_AI_GRPC_ADDR: ai:50051
  SCID_S3_ENDPOINT: http://rustfs:9000
  SCID_S3_ACCESS_KEY: ${SCID_S3_ACCESS_KEY:-scidirector}
  SCID_S3_SECRET_KEY: ${SCID_S3_SECRET_KEY:-scidirector-secret}
  SCID_S3_BUCKET: ${SCID_S3_BUCKET:-scidirector-artifacts}
  SCID_MEDIA_WORK_DIR: /data/work
  # 可观测性（阶段五）。缺省**关闭**：没跑 collector 时应当是无害的 no-op，
  # 而不是让每个进程都去连一个不存在的端点然后刷一屏导出错误。
  # 要打开就把 SCID_OTEL_ENDPOINT 设为 otel-collector:4317（见 .env.example）。
  SCID_OTEL_ENDPOINT: ${SCID_OTEL_ENDPOINT:-}
  SCID_OTEL_INSECURE: ${SCID_OTEL_INSECURE:-true}
  SCID_OTEL_SAMPLE_RATIO: ${SCID_OTEL_SAMPLE_RATIO:-1.0}
  SCID_METRICS_PATH: ${SCID_METRICS_PATH:-/metrics}

services:
  # ---------------------------------------------------------------------------
  # Redis：Asynq 任务队列 + 分镜状态缓存 + 分布式锁
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: scid-redis
    <<: *restart
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    ports:
      - "${SCID_REDIS_PORT:-6379}:6379"
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Postgres：LangGraph checkpointer（状态持久化 / 断点续跑）+ 任务元数据
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: scid-postgres
    <<: *restart
    environment:
      POSTGRES_USER: ${SCID_PG_USER:-scidirector}
      POSTGRES_PASSWORD: ${SCID_PG_PASSWORD:-scidirector}
      POSTGRES_DB: ${SCID_PG_DB:-scidirector}
    ports:
      - "${SCID_PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCID_PG_USER:-scidirector} -d ${SCID_PG_DB:-scidirector}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # RustFS：S3 兼容对象存储，存放分镜 MP4 / 抽帧 PNG / 最终成片
  #
  # 为什么不是 MinIO：MinIO 开源版已归档停更（不再提供安全更新、
  # 官方站点不再分发），不适合作为产线依赖。RustFS 同为 S3 兼容、
  # 仍在活跃维护，且端口布局一致（9000 S3 / 9001 控制台），替换成本很低。
  #
  # 这里**不再有** bucket 初始化容器：原来那个用 `minio/mc`（同样已归档）跑
  # `mc mb` + `mc anonymous set download`。现在建桶由代码负责 ——
  # `S3Archiver.ensureBucket` 在首次上传时按需创建，且这条路径由
  # `archive/s3_e2e_test.go` 的端到端用例覆盖（`make test-s3`）。
  # 少一个容器、少一个已归档的镜像依赖，也少一处「init 跑失败但没人看」的隐患。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: scid-rustfs
    <<: *restart
    environment:
      # 单机模式：直接用 /data 这一个目录（分布式模式才需要多卷表达式）。
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # 凭据沿用 SCID_S3_*：与 Go 侧读的变量名保持一致，
      # 免得出现「compose 设了一个名字、代码读另一个名字」的静默错配。
      RUSTFS_ACCESS_KEY: ${SCID_S3_ACCESS_KEY:-scidirector}
      RUSTFS_SECRET_KEY: ${SCID_S3_SECRET_KEY:-scidirector-secret}
    ports:
      - "${SCID_S3_PORT:-9000}:9000"
      - "${SCID_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # 镜像里没有 bash（有 sh / curl / wget / nc），所以不能用 `</dev/tcp/...`
      # 这种 bash 专用写法 —— 那会让健康检查永远失败、容器一直停在 starting。
      # RustFS 提供了与 MinIO 同名同义的存活/就绪端点，直接用 curl 探最可靠。
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Python AI 大脑：FastAPI(HTTP) + gRPC server + LangGraph worker pool
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: scid-ai
    <<: *restart
    environment:
      <<: *common-env
      SCID_AI_GRPC_PORT: "50051"
      SCID_AI_HTTP_PORT: "8000"
      SCID_LLM_PROVIDER: ${SCID_LLM_PROVIDER:-openai}
      SCID_LLM_MODEL: ${SCID_LLM_MODEL:-gpt-4o}
      SCID_VLM_MODEL: ${SCID_VLM_MODEL:-gpt-4o}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SCID_SANDBOX_TIMEOUT_SEC: "180"
      SCID_SANDBOX_MAX_MEMORY_MB: "2048"
    ports:
      - "${SCID_AI_GRPC_PORT:-50051}:50051"
      - "${SCID_AI_HTTP_PORT:-8000}:8000"
    volumes:
      - media-work:/data/work
      - ./ai:/app:delegated
    # Manim 渲染 + LaTeX 编译对 CPU/内存要求较高，按需开启
    shm_size: "1gb"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Go API 网关：REST + WebSocket，接收脚本、推送进度、回流人工意见
  # ---------------------------------------------------------------------------
  api:
    build:
      <<: *go-build
    container_name: scid-api
    <<: *restart
    command: ["/app/scid-api"]
    environment:
      <<: *common-env
      SCID_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "${SCID_API_PORT:-8080}:8080"
    volumes:
      - media-work:/data/work
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Go Worker：Asynq 消费者，编排 gRPC 调用 + ffmpeg 并发合成
  # ---------------------------------------------------------------------------
  worker:
    build:
      <<: *go-build
    container_name: scid-worker
    <<: *restart
    command: ["/app/scid-worker"]
    environment:
      <<: *common-env
      SCID_WORKER_CONCURRENCY: ${SCID_WORKER_CONCURRENCY:-4}
      SCID_FFMPEG_BIN: ffmpeg
      # 全局 ffmpeg 进程数上限（整个 worker 进程共享，不是每任务一个）。
      # 这是防 OOM 的闸门：调大之前先确认内存够 —— 单个 1080p ffmpeg
      # 峰值可达数百 MB，4 路并发就是 GB 级。
      SCID_FFMPEG_MAX_PARALLEL: ${SCID_FFMPEG_MAX_PARALLEL:-4}
      # 单条 ffmpeg 命令硬超时。没有它，卡死的进程会永久占住一个并发槽位，
      # 占满之后整条流水线静默停摆且无任何错误可报。
      SCID_FFMPEG_CMD_TIMEOUT: ${SCID_FFMPEG_CMD_TIMEOUT:-10m}
      # 跨镜头转场。none = 硬切（走 concat -c copy，最快）；
      # 其它取值需要重编码整条成片，是明确的性能代价。
      SCID_TRANSITION: ${SCID_TRANSITION:-fade}
      SCID_TRANSITION_DURATION_SEC: ${SCID_TRANSITION_DURATION_SEC:-0.4}
      # 统一调色（0 = 不调整）。只做「全片一致」的微调，
      # 创作性调色应由导演智能体决定，不在这里硬编码。
      SCID_COLOR_SATURATION: ${SCID_COLOR_SATURATION:-0}
      SCID_COLOR_CONTRAST: ${SCID_COLOR_CONTRAST:-0}
      # 字幕（软字幕 mov_text，可开关、不破坏画面）。
      # 全片统一 TTS 配音尚未接入，字幕时间轴目前按画外音文本长度比例估算；
      # 接入 TTS 后应改为按真实音频时长对齐。
      SCID_SUBTITLE_ENABLED: ${SCID_SUBTITLE_ENABLED:-true}
      SCID_SUBTITLE_MAX_CHARS: ${SCID_SUBTITLE_MAX_CHARS:-18}
      SCID_SUBTITLE_MIN_CUE_SEC: ${SCID_SUBTITLE_MIN_CUE_SEC:-0.8}
      # 产物归档。默认 none —— 单机开发与 CI 没有对象存储，
      # 缺省必须是一条能跑通的路径。compose 里显式指向内置 RustFS。
      #
      # 连接参数（端点/密钥/bucket/SSL）统一在 x-common-env 里给，
      # 变量名是 SCID_S3_*，与 Go 侧读取的名字一致。
      # 原先这里额外设了一套 SCID_MINIO_*，而公共块里又设了 SCID_S3_* ——
      # 代码只读前者，于是公共块那两个值从来没生效过，属于静默错配。
      SCID_ARCHIVE_BACKEND: ${SCID_ARCHIVE_BACKEND:-s3}
      SCID_ARCHIVE_KEEP_ALL: ${SCID_ARCHIVE_KEEP_ALL:-false}
      SCID_ARCHIVE_KEEP_NORMALIZED: ${SCID_ARCHIVE_KEEP_NORMALIZED:-false}
    volumes:
      - media-work:/data/work
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_started

  # ---------------------------------------------------------------------------
  # 可观测性：collector -> Tempo（追踪）+ Prometheus（指标）-> Grafana（看板）
  #
  # 为什么走 collector 而不是应用直连 Tempo：应用只认一个地址，
  # 换后端不必重发布应用；collector 挂了应用只是导出超时被丢弃，
  # 而直连时后端的任何抖动都会回到业务代码里。
  #
  # 这四个都是**可选的**：不启动它们时应用照常运行（追踪是 no-op），
  # 因此在 compose 里用 profile 隔离，不拖慢日常 `up -d`。
  #   docker compose --profile observability up -d
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: scid-otel-collector
    <<: *restart
    profiles: ["observability"]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "${SCID_OTEL_GRPC_PORT:-4317}:4317"
      - "${SCID_OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
    # **刻意不配 healthcheck。**
    #
    # 这个镜像是 distroless 的（没有 sh、没有 curl/wget/nc，什么都没有），
    # 容器内**无法**发起任何探测 —— 上一版写的 `wget --spider .../13133/`
    # 让容器永久停在 `unhealthy`：明明 collector 在正常收 span 并导出到 Tempo，
    # 状态却是红的。一个永远为红的健康检查比没有更糟 —— 它会训练人忽略这一列。
    #
    # collector 自己的 health_check 扩展仍然开着（13133），从**宿主机**探：
    #   curl -s -o /dev/null -w '%{http_code}' localhost:13133/
    # 需要容器内探活时应换成带 shell 的镜像或用 compose 之外的探针。

  tempo:
    image: grafana/tempo:2.6.1
    container_name: scid-tempo
    <<: *restart
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/otel/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${SCID_TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: scid-prometheus
    <<: *restart
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # 让容器能访问宿主机上直接运行的 Go 进程（本机开发工作流，见抓取配置的说明）。
    # 纯 compose 部署下这个别名指向宿主、抓不到东西，是预期行为。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SCID_PROMETHEUS_PORT:-9090}:9090"
    # **刻意不 depends_on api**：Prometheus 抓的是一个稍后才出现的目标是完全正常的
    # （target 先显示 down，应用起来后自动转 up）。加上依赖反而会逼 compose
    # 去构建 api 镜像 —— 观测栈不该把应用镜像的构建拖进来。
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.4.0
    container_name: scid-grafana
    <<: *restart
    profiles: ["observability"]
    environment:
      # 单机开发关闭登录：看板是验收对象，不该卡在"先建个管理员账号"上。
      # **生产必须打开并接 SSO/OAuth** —— 追踪数据里有任务脚本与内部拓扑。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${SCID_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - tempo
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # React 分镜审核台（人类反馈闭环 HITL）
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
        VITE_WS_BASE: ${VITE_WS_BASE:-ws://localhost:8080}
    container_name: scid-web
    <<: *restart
    ports:
      - "${SCID_WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  redis-data:
  pg-data:
  # 卷名随对象存储一起改（minio-data → rustfs-data）。
  # 这会让旧的本地卷不再被挂载 —— 单机开发卷里只是可重建的产物缓存，
  # 但如果你手上有想保留的旧数据，改名后需要自己 migrate。
  rustfs-data:
  media-work:
  # 追踪/指标/看板数据。都是可重建的观测数据，
  # 但仍然给命名卷：容器重建后还能回看上一次的链路。
  tempo-data:
  prometheus-data:
  grafana-data:
