[project]
name = "scidirector-ai"
version = "0.1.0"
description = "SciDirector AI 大脑：基于 LangGraph 的多智能体科学视频导演（导演/编码/审查）"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "grpcio>=1.66,<2.0",
    "grpcio-tools>=1.66,<2.0",
    "protobuf>=5.28,<7.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "langgraph>=1.0,<2.0",
    "langchain-core>=0.3",
    "openai>=1.50",
    "redis>=5.0",
    "structlog>=24.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# 渲染依赖体积很大（Manim + TeX + 浏览器），单独分组以便按需安装。
render = ["manim>=0.18", "playwright>=1.47", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
scidirector-ai = "scidirector_ai.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scidirector_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# 说明：暂未启用 asyncio_mode —— 当前所有测试都是同步的（gRPC servicer 也跑在线程池里）。
# 等引入异步测试时，安装 pytest-asyncio 后再打开该选项，
# 否则缺少插件时会持续产生 "Unknown config option" 警告，污染输出。

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# SIM: 简化建议, RUF: ruff 专有规则
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # 行长由 formatter 控制，中文注释按字符宽度会误报
    "B008",  # FastAPI/依赖注入惯用「函数调用作为默认值」
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
